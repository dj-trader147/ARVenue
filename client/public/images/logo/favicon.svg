<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba73"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#8c6d46"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Square -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- AR VENUE Monogram / Emblem -->
  <!-- Letter A -->
  <path d="M190 350 L256 160 L322 350 M210 300 L302 300" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Outer Gold Luxury Crest Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.6"/>
  
  <!-- Bottom Brand Ribbon Text -->
  <text x="256" y="415" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">AR VENUE</text>
</svg>